services:
  webui-aria2:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      # Finished downloads (and .aria2 control files) on your machine
      - ${DOWNLOADS_DIR:-./downloads}:/downloads
      # aria2 session queue + aria2.conf (Docker-managed, not mixed with downloads)
      - aria2_data:/var/lib/aria2
    restart: unless-stopped

volumes:
  aria2_data:
